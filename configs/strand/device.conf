# Strand: Redmi Note 12 Pro / Pro+ 5G (MT6877, 6x A55 policy0 + 2x A78 policy6,
# Mali-G68 behind GED). libperfmgr owns the CPU limits and resets them after
# every boost, so profiles go through the power HAL (fixedperf, powersave);
# the limits are the FIXED_PERFORMANCE and LOW_POWER actions in powerhint.json.

[profile performance]
fixedperf on
setting system min_refresh_rate 120.0

[profile battery]
setting system peak_refresh_rate 60.0

[profile gaming]
fixedperf on
setting system min_refresh_rate 120.0

[stats]
stat gpu_busy_pct /sys/kernel/ged/hal/gpu_utilization

[adaptive]
# GED prints "loading block idle"; strandd reads the first number
gpu_busy_path = /sys/kernel/ged/hal/gpu_utilization
